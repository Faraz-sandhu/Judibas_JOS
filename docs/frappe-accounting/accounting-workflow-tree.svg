<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 805" role="img" aria-label="ERPNext Accounting workflow tree"><rect width="700" height="805" fill="#ffffff"/><rect x="2" y="366" width="125" height="66" rx="9" fill="#252c46" stroke="#fff" stroke-width="1.4"/><text x="64.5" y="390.0" dominant-baseline="middle" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13">COMPANY</text><text x="64.5" y="408.0" dominant-baseline="middle" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13">Accounting cycle</text><path d="M127 399 C148 399 145 59 170 59" fill="none" stroke="#6554cc" stroke-width="1.5"/><rect x="170" y="33" width="151" height="53" rx="9" fill="#f7f8fc" stroke="#6554cc" stroke-width="1.4"/><text x="245.5" y="59.5" dominant-baseline="middle" text-anchor="middle" fill="#6554cc" font-family="Arial" font-size="13">1. Set up</text><path d="M321 59 C340 59 340 29 356 29" fill="none" stroke="#6554cc" stroke-width="1.2"/><rect x="356" y="16" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#6554cc" stroke-width="1.4"/><text x="526.0" y="29.0" dominant-baseline="middle" text-anchor="middle" fill="#6554cc" font-family="Arial" font-size="13">Company, dates and account structure</text><path d="M321 59 C340 59 340 59 356 59" fill="none" stroke="#6554cc" stroke-width="1.2"/><rect x="356" y="46" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#6554cc" stroke-width="1.4"/><text x="526.0" y="59.0" dominant-baseline="middle" text-anchor="middle" fill="#6554cc" font-family="Arial" font-size="13">Parties, currency, taxes and defaults</text><path d="M321 59 C340 59 340 89 356 89" fill="none" stroke="#6554cc" stroke-width="1.2"/><rect x="356" y="76" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#6554cc" stroke-width="1.4"/><text x="526.0" y="89.0" dominant-baseline="middle" text-anchor="middle" fill="#6554cc" font-family="Arial" font-size="13">Opening figures checked by accountant</text><path d="M127 399 C148 399 145 170 170 170" fill="none" stroke="#168782" stroke-width="1.5"/><rect x="170" y="144" width="151" height="53" rx="9" fill="#f7f8fc" stroke="#168782" stroke-width="1.4"/><text x="245.5" y="170.5" dominant-baseline="middle" text-anchor="middle" fill="#168782" font-family="Arial" font-size="13">2. Prepare</text><path d="M321 170 C340 170 340 140 356 140" fill="none" stroke="#168782" stroke-width="1.2"/><rect x="356" y="127" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#168782" stroke-width="1.4"/><text x="526.0" y="140.0" dominant-baseline="middle" text-anchor="middle" fill="#168782" font-family="Arial" font-size="13">Sales Invoice for customer billing</text><path d="M321 170 C340 170 340 170 356 170" fill="none" stroke="#168782" stroke-width="1.2"/><rect x="356" y="157" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#168782" stroke-width="1.4"/><text x="526.0" y="170.0" dominant-baseline="middle" text-anchor="middle" fill="#168782" font-family="Arial" font-size="13">Purchase Invoice for supplier billing</text><path d="M321 170 C340 170 340 200 356 200" fill="none" stroke="#168782" stroke-width="1.2"/><rect x="356" y="187" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#168782" stroke-width="1.4"/><text x="526.0" y="200.0" dominant-baseline="middle" text-anchor="middle" fill="#168782" font-family="Arial" font-size="13">Journal Entry for deliberate adjustments</text><path d="M127 399 C148 399 145 281 170 281" fill="none" stroke="#c47b23" stroke-width="1.5"/><rect x="170" y="255" width="151" height="53" rx="9" fill="#f7f8fc" stroke="#c47b23" stroke-width="1.4"/><text x="245.5" y="281.5" dominant-baseline="middle" text-anchor="middle" fill="#c47b23" font-family="Arial" font-size="13">3. Submit</text><path d="M321 281 C340 281 340 251 356 251" fill="none" stroke="#c47b23" stroke-width="1.2"/><rect x="356" y="238" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#c47b23" stroke-width="1.4"/><text x="526.0" y="251.0" dominant-baseline="middle" text-anchor="middle" fill="#c47b23" font-family="Arial" font-size="13">Validate document and account mapping</text><path d="M321 281 C340 281 340 281 356 281" fill="none" stroke="#c47b23" stroke-width="1.2"/><rect x="356" y="268" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#c47b23" stroke-width="1.4"/><text x="526.0" y="281.0" dominant-baseline="middle" text-anchor="middle" fill="#c47b23" font-family="Arial" font-size="13">Submission creates ledger postings</text><path d="M321 281 C340 281 340 311 356 311" fill="none" stroke="#c47b23" stroke-width="1.2"/><rect x="356" y="298" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#c47b23" stroke-width="1.4"/><text x="526.0" y="311.0" dominant-baseline="middle" text-anchor="middle" fill="#c47b23" font-family="Arial" font-size="13">Drafts do not equal posted transactions</text><path d="M127 399 C148 399 145 392 170 392" fill="none" stroke="#3974ba" stroke-width="1.5"/><rect x="170" y="366" width="151" height="53" rx="9" fill="#f7f8fc" stroke="#3974ba" stroke-width="1.4"/><text x="245.5" y="392.5" dominant-baseline="middle" text-anchor="middle" fill="#3974ba" font-family="Arial" font-size="13">4. Settle</text><path d="M321 392 C340 392 340 362 356 362" fill="none" stroke="#3974ba" stroke-width="1.2"/><rect x="356" y="349" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#3974ba" stroke-width="1.4"/><text x="526.0" y="362.0" dominant-baseline="middle" text-anchor="middle" fill="#3974ba" font-family="Arial" font-size="13">Receive customer payment / pay supplier</text><path d="M321 392 C340 392 340 392 356 392" fill="none" stroke="#3974ba" stroke-width="1.2"/><rect x="356" y="379" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#3974ba" stroke-width="1.4"/><text x="526.0" y="392.0" dominant-baseline="middle" text-anchor="middle" fill="#3974ba" font-family="Arial" font-size="13">Allocate full or partial invoice amounts</text><path d="M321 392 C340 392 340 422 356 422" fill="none" stroke="#3974ba" stroke-width="1.2"/><rect x="356" y="409" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#3974ba" stroke-width="1.4"/><text x="526.0" y="422.0" dominant-baseline="middle" text-anchor="middle" fill="#3974ba" font-family="Arial" font-size="13">Track advances and outstanding balances</text><path d="M127 399 C148 399 145 503 170 503" fill="none" stroke="#9a5686" stroke-width="1.5"/><rect x="170" y="477" width="151" height="53" rx="9" fill="#f7f8fc" stroke="#9a5686" stroke-width="1.4"/><text x="245.5" y="503.5" dominant-baseline="middle" text-anchor="middle" fill="#9a5686" font-family="Arial" font-size="13">5. Reconcile</text><path d="M321 503 C340 503 340 473 356 473" fill="none" stroke="#9a5686" stroke-width="1.2"/><rect x="356" y="460" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#9a5686" stroke-width="1.4"/><text x="526.0" y="473.0" dominant-baseline="middle" text-anchor="middle" fill="#9a5686" font-family="Arial" font-size="13">Match payments to invoices as required</text><path d="M321 503 C340 503 340 503 356 503" fill="none" stroke="#9a5686" stroke-width="1.2"/><rect x="356" y="490" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#9a5686" stroke-width="1.4"/><text x="526.0" y="503.0" dominant-baseline="middle" text-anchor="middle" fill="#9a5686" font-family="Arial" font-size="13">Match bank statement to recorded vouchers</text><path d="M321 503 C340 503 340 533 356 533" fill="none" stroke="#9a5686" stroke-width="1.2"/><rect x="356" y="520" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#9a5686" stroke-width="1.4"/><text x="526.0" y="533.0" dominant-baseline="middle" text-anchor="middle" fill="#9a5686" font-family="Arial" font-size="13">Resolve fees, differences and duplicates</text><path d="M127 399 C148 399 145 614 170 614" fill="none" stroke="#5a8252" stroke-width="1.5"/><rect x="170" y="588" width="151" height="53" rx="9" fill="#f7f8fc" stroke="#5a8252" stroke-width="1.4"/><text x="245.5" y="614.5" dominant-baseline="middle" text-anchor="middle" fill="#5a8252" font-family="Arial" font-size="13">6. Analyse</text><path d="M321 614 C340 614 340 584 356 584" fill="none" stroke="#5a8252" stroke-width="1.2"/><rect x="356" y="571" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#5a8252" stroke-width="1.4"/><text x="526.0" y="584.0" dominant-baseline="middle" text-anchor="middle" fill="#5a8252" font-family="Arial" font-size="13">Review general ledger and trial balance</text><path d="M321 614 C340 614 340 614 356 614" fill="none" stroke="#5a8252" stroke-width="1.2"/><rect x="356" y="601" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#5a8252" stroke-width="1.4"/><text x="526.0" y="614.0" dominant-baseline="middle" text-anchor="middle" fill="#5a8252" font-family="Arial" font-size="13">Check profit, position and cash flow</text><path d="M321 614 C340 614 340 644 356 644" fill="none" stroke="#5a8252" stroke-width="1.2"/><rect x="356" y="631" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#5a8252" stroke-width="1.4"/><text x="526.0" y="644.0" dominant-baseline="middle" text-anchor="middle" fill="#5a8252" font-family="Arial" font-size="13">Filter by cost center, project or dimension</text><path d="M127 399 C148 399 145 725 170 725" fill="none" stroke="#557184" stroke-width="1.5"/><rect x="170" y="699" width="151" height="53" rx="9" fill="#f7f8fc" stroke="#557184" stroke-width="1.4"/><text x="245.5" y="725.5" dominant-baseline="middle" text-anchor="middle" fill="#557184" font-family="Arial" font-size="13">7. Control</text><path d="M321 725 C340 725 340 695 356 695" fill="none" stroke="#557184" stroke-width="1.2"/><rect x="356" y="682" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#557184" stroke-width="1.4"/><text x="526.0" y="695.0" dominant-baseline="middle" text-anchor="middle" fill="#557184" font-family="Arial" font-size="13">Use reversals and supported corrections</text><path d="M321 725 C340 725 340 725 356 725" fill="none" stroke="#557184" stroke-width="1.2"/><rect x="356" y="712" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#557184" stroke-width="1.4"/><text x="526.0" y="725.0" dominant-baseline="middle" text-anchor="middle" fill="#557184" font-family="Arial" font-size="13">Review permissions and reporting periods</text><path d="M321 725 C340 725 340 755 356 755" fill="none" stroke="#557184" stroke-width="1.2"/><rect x="356" y="742" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#557184" stroke-width="1.4"/><text x="526.0" y="755.0" dominant-baseline="middle" text-anchor="middle" fill="#557184" font-family="Arial" font-size="13">Retain evidence and test backup recovery</text></svg>