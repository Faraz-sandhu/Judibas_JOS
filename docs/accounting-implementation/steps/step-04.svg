<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" role="img" aria-label="Step 4 implementation diagram"><rect width="700" height="310" rx="14" fill="#f5f6fb"/><text x="22" y="32" font-family="Arial" font-size="17" font-weight="bold" fill="#303850">STEP 04 / Build and prove the ledger engine</text><rect x="18" y="57" width="204" height="152" rx="10" fill="white" stroke="#168782"/><text x="32" y="82" font-size="12" font-family="Arial" font-weight="bold" fill="#168782">START WITH</text><text x="32" y="109" font-size="12.5" font-family="Arial" fill="#303850">Validated voucher</text><text x="32" y="130" font-size="12.5" font-family="Arial" fill="#303850">Account mapping</text><text x="32" y="151" font-size="12.5" font-family="Arial" fill="#303850">Posting request key</text><rect x="248" y="57" width="204" height="152" rx="10" fill="white" stroke="#6554cc"/><text x="262" y="82" font-size="12" font-family="Arial" font-weight="bold" fill="#6554cc">BUILD / DECIDE</text><text x="262" y="109" font-size="12.5" font-family="Arial" fill="#303850">Check balanced lines</text><text x="262" y="130" font-size="12.5" font-family="Arial" fill="#303850">Lock and post atomically</text><text x="262" y="151" font-size="12.5" font-family="Arial" fill="#303850">Block duplicate posting</text><rect x="478" y="57" width="204" height="152" rx="10" fill="white" stroke="#3974ba"/><text x="492" y="82" font-size="12" font-family="Arial" font-weight="bold" fill="#3974ba">DELIVER</text><text x="492" y="109" font-size="12.5" font-family="Arial" fill="#303850">Posted voucher</text><text x="492" y="130" font-size="12.5" font-family="Arial" fill="#303850">Balanced ledger</text><text x="492" y="151" font-size="12.5" font-family="Arial" fill="#303850">Traceable source link</text><path d="M224 129h20m-7-5 7 5-7 5" fill="none" stroke="#7c87a0" stroke-width="2"/><path d="M454 129h20m-7-5 7 5-7 5" fill="none" stroke="#7c87a0" stroke-width="2"/><rect x="18" y="227" width="664" height="66" rx="9" fill="#e9e6fa"/><text x="31" y="249" font-family="Arial" font-weight="bold" font-size="12" fill="#6554cc">PASS THIS CHECK BEFORE MOVING ON</text><text x="31" y="269" font-family="Arial" font-size="12.5" fill="#303850">A failure must leave neither half a posting nor a duplicate.</text></svg>