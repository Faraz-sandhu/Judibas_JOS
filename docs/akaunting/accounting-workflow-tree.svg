<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 805" role="img" aria-label="Accounting workflow tree"><rect width="700" height="805" fill="#ffffff"/><rect x="2" y="366" width="125" height="66" rx="9" fill="#252c46" stroke="#fff" stroke-width="1.4"/><text x="64.5" y="390.0" dominant-baseline="middle" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13">COMPANY</text><text x="64.5" y="408.0" dominant-baseline="middle" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13">Accounting cycle</text><path d="M127 399 C148 399 145 59 170 59" fill="none" stroke="#6554cc" stroke-width="1.5"/><rect x="170" y="33" width="151" height="53" rx="9" fill="#f7f8fc" stroke="#6554cc" stroke-width="1.4"/><text x="245.5" y="59.5" dominant-baseline="middle" text-anchor="middle" fill="#6554cc" font-family="Arial" font-size="13">1. Configure</text><path d="M321 59 C340 59 340 29 356 29" fill="none" stroke="#6554cc" stroke-width="1.2"/><rect x="356" y="16" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#6554cc" stroke-width="1.4"/><text x="526.0" y="29.0" dominant-baseline="middle" text-anchor="middle" fill="#6554cc" font-family="Arial" font-size="13">Choose company, currency and dates</text><path d="M321 59 C340 59 340 59 356 59" fill="none" stroke="#6554cc" stroke-width="1.2"/><rect x="356" y="46" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#6554cc" stroke-width="1.4"/><text x="526.0" y="59.0" dominant-baseline="middle" text-anchor="middle" fill="#6554cc" font-family="Arial" font-size="13">Set tax rules, accounts and roles</text><path d="M321 59 C340 59 340 89 356 89" fill="none" stroke="#6554cc" stroke-width="1.2"/><rect x="356" y="76" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#6554cc" stroke-width="1.4"/><text x="526.0" y="89.0" dominant-baseline="middle" text-anchor="middle" fill="#6554cc" font-family="Arial" font-size="13">Add customers, vendors and items</text><path d="M127 399 C148 399 145 170 170 170" fill="none" stroke="#168782" stroke-width="1.5"/><rect x="170" y="144" width="151" height="53" rx="9" fill="#f7f8fc" stroke="#168782" stroke-width="1.4"/><text x="245.5" y="170.5" dominant-baseline="middle" text-anchor="middle" fill="#168782" font-family="Arial" font-size="13">2. Sell</text><path d="M321 170 C340 170 340 140 356 140" fill="none" stroke="#168782" stroke-width="1.2"/><rect x="356" y="127" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#168782" stroke-width="1.4"/><text x="526.0" y="140.0" dominant-baseline="middle" text-anchor="middle" fill="#168782" font-family="Arial" font-size="13">Create customer invoice</text><path d="M321 170 C340 170 340 170 356 170" fill="none" stroke="#168782" stroke-width="1.2"/><rect x="356" y="157" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#168782" stroke-width="1.4"/><text x="526.0" y="170.0" dominant-baseline="middle" text-anchor="middle" fill="#168782" font-family="Arial" font-size="13">Receive / match full or partial payment</text><path d="M321 170 C340 170 340 200 356 200" fill="none" stroke="#168782" stroke-width="1.2"/><rect x="356" y="187" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#168782" stroke-width="1.4"/><text x="526.0" y="200.0" dominant-baseline="middle" text-anchor="middle" fill="#168782" font-family="Arial" font-size="13">Track remaining customer balance</text><path d="M127 399 C148 399 145 281 170 281" fill="none" stroke="#c47b23" stroke-width="1.5"/><rect x="170" y="255" width="151" height="53" rx="9" fill="#f7f8fc" stroke="#c47b23" stroke-width="1.4"/><text x="245.5" y="281.5" dominant-baseline="middle" text-anchor="middle" fill="#c47b23" font-family="Arial" font-size="13">3. Purchase</text><path d="M321 281 C340 281 340 251 356 251" fill="none" stroke="#c47b23" stroke-width="1.2"/><rect x="356" y="238" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#c47b23" stroke-width="1.4"/><text x="526.0" y="251.0" dominant-baseline="middle" text-anchor="middle" fill="#c47b23" font-family="Arial" font-size="13">Create supplier bill or expense</text><path d="M321 281 C340 281 340 281 356 281" fill="none" stroke="#c47b23" stroke-width="1.2"/><rect x="356" y="268" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#c47b23" stroke-width="1.4"/><text x="526.0" y="281.0" dominant-baseline="middle" text-anchor="middle" fill="#c47b23" font-family="Arial" font-size="13">Record / match supplier payment</text><path d="M321 281 C340 281 340 311 356 311" fill="none" stroke="#c47b23" stroke-width="1.2"/><rect x="356" y="298" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#c47b23" stroke-width="1.4"/><text x="526.0" y="311.0" dominant-baseline="middle" text-anchor="middle" fill="#c47b23" font-family="Arial" font-size="13">Track remaining amount payable</text><path d="M127 399 C148 399 145 392 170 392" fill="none" stroke="#3974ba" stroke-width="1.5"/><rect x="170" y="366" width="151" height="53" rx="9" fill="#f7f8fc" stroke="#3974ba" stroke-width="1.4"/><text x="245.5" y="392.5" dominant-baseline="middle" text-anchor="middle" fill="#3974ba" font-family="Arial" font-size="13">4. Verify cash</text><path d="M321 392 C340 392 340 362 356 362" fill="none" stroke="#3974ba" stroke-width="1.2"/><rect x="356" y="349" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#3974ba" stroke-width="1.4"/><text x="526.0" y="362.0" dominant-baseline="middle" text-anchor="middle" fill="#3974ba" font-family="Arial" font-size="13">Record the correct bank / cash account</text><path d="M321 392 C340 392 340 392 356 392" fill="none" stroke="#3974ba" stroke-width="1.2"/><rect x="356" y="379" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#3974ba" stroke-width="1.4"/><text x="526.0" y="392.0" dominant-baseline="middle" text-anchor="middle" fill="#3974ba" font-family="Arial" font-size="13">Match imported transactions once</text><path d="M321 392 C340 392 340 422 356 422" fill="none" stroke="#3974ba" stroke-width="1.2"/><rect x="356" y="409" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#3974ba" stroke-width="1.4"/><text x="526.0" y="422.0" dominant-baseline="middle" text-anchor="middle" fill="#3974ba" font-family="Arial" font-size="13">Reconcile records against statements</text><path d="M127 399 C148 399 145 503 170 503" fill="none" stroke="#9a5686" stroke-width="1.5"/><rect x="170" y="477" width="151" height="53" rx="9" fill="#f7f8fc" stroke="#9a5686" stroke-width="1.4"/><text x="245.5" y="503.5" dominant-baseline="middle" text-anchor="middle" fill="#9a5686" font-family="Arial" font-size="13">5. Post ledger [A]</text><path d="M321 503 C340 503 340 473 356 473" fill="none" stroke="#9a5686" stroke-width="1.2"/><rect x="356" y="460" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#9a5686" stroke-width="1.4"/><text x="526.0" y="473.0" dominant-baseline="middle" text-anchor="middle" fill="#9a5686" font-family="Arial" font-size="13">Map income, expense and tax accounts</text><path d="M321 503 C340 503 340 503 356 503" fill="none" stroke="#9a5686" stroke-width="1.2"/><rect x="356" y="490" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#9a5686" stroke-width="1.4"/><text x="526.0" y="503.0" dominant-baseline="middle" text-anchor="middle" fill="#9a5686" font-family="Arial" font-size="13">Check journals and account balances</text><path d="M321 503 C340 503 340 533 356 533" fill="none" stroke="#9a5686" stroke-width="1.2"/><rect x="356" y="520" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#9a5686" stroke-width="1.4"/><text x="526.0" y="533.0" dominant-baseline="middle" text-anchor="middle" fill="#9a5686" font-family="Arial" font-size="13">Review adjustments with accountant</text><path d="M127 399 C148 399 145 614 170 614" fill="none" stroke="#5a8252" stroke-width="1.5"/><rect x="170" y="588" width="151" height="53" rx="9" fill="#f7f8fc" stroke="#5a8252" stroke-width="1.4"/><text x="245.5" y="614.5" dominant-baseline="middle" text-anchor="middle" fill="#5a8252" font-family="Arial" font-size="13">6. Review results</text><path d="M321 614 C340 614 340 584 356 584" fill="none" stroke="#5a8252" stroke-width="1.2"/><rect x="356" y="571" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#5a8252" stroke-width="1.4"/><text x="526.0" y="584.0" dominant-baseline="middle" text-anchor="middle" fill="#5a8252" font-family="Arial" font-size="13">Check income, expenses and taxes</text><path d="M321 614 C340 614 340 614 356 614" fill="none" stroke="#5a8252" stroke-width="1.2"/><rect x="356" y="601" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#5a8252" stroke-width="1.4"/><text x="526.0" y="614.0" dominant-baseline="middle" text-anchor="middle" fill="#5a8252" font-family="Arial" font-size="13">Review receivables and payables</text><path d="M321 614 C340 614 340 644 356 644" fill="none" stroke="#5a8252" stroke-width="1.2"/><rect x="356" y="631" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#5a8252" stroke-width="1.4"/><text x="526.0" y="644.0" dominant-baseline="middle" text-anchor="middle" fill="#5a8252" font-family="Arial" font-size="13">Use ledger statements if app enabled</text><path d="M127 399 C148 399 145 725 170 725" fill="none" stroke="#557184" stroke-width="1.5"/><rect x="170" y="699" width="151" height="53" rx="9" fill="#f7f8fc" stroke="#557184" stroke-width="1.4"/><text x="245.5" y="725.5" dominant-baseline="middle" text-anchor="middle" fill="#557184" font-family="Arial" font-size="13">7. Repeat &amp; control</text><path d="M321 725 C340 725 340 695 356 695" fill="none" stroke="#557184" stroke-width="1.2"/><rect x="356" y="682" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#557184" stroke-width="1.4"/><text x="526.0" y="695.0" dominant-baseline="middle" text-anchor="middle" fill="#557184" font-family="Arial" font-size="13">Resolve discrepancies and missing proof</text><path d="M321 725 C340 725 340 725 356 725" fill="none" stroke="#557184" stroke-width="1.2"/><rect x="356" y="712" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#557184" stroke-width="1.4"/><text x="526.0" y="725.0" dominant-baseline="middle" text-anchor="middle" fill="#557184" font-family="Arial" font-size="13">Review access, exports and backups</text><path d="M321 725 C340 725 340 755 356 755" fill="none" stroke="#557184" stroke-width="1.2"/><rect x="356" y="742" width="340" height="26" rx="9" fill="#f7f8fc" stroke="#557184" stroke-width="1.4"/><text x="526.0" y="755.0" dominant-baseline="middle" text-anchor="middle" fill="#557184" font-family="Arial" font-size="13">Repeat for next reporting period</text></svg>